name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-analysis:
    name: GitHub Actions static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Actionlint
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          GOBIN="$RUNNER_TEMP/actionlint" \
            go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
      - name: Validate workflow syntax
        run: |
          "$RUNNER_TEMP/actionlint/actionlint"
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          version: 1.28.0
          persona: pedantic
          advanced-security: false
          annotations: true

  build:
    name: Build and test (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint shell
        if: runner.os == 'Linux'
        run: shellcheck tests/*.sh benchmarks/*.sh
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release
      - name: Install
        run: |
          cmake --install out/build/release --prefix install --component sqrail
          install/bin/sqrail --version
          test -f install/share/doc/sqrail/THIRD_PARTY_NOTICES.md
          test -f install/share/doc/sqrail/licenses/duckdb-third-party/zstd/LICENSE
          test "$(find install -type f \( -name '*.a' -o -name '*.h' -o -name '*.hpp' \) | wc -l)" -eq 0
      - name: Verify Linux runtime
        if: runner.os == 'Linux'
        run: |
          ldd out/build/release/sqrail
          if ldd out/build/release/sqrail | grep -E 'libstdc\+\+|libgcc_s'; then
            echo "C++ runtime is dynamically linked" >&2
            exit 1
          fi
      - name: Size
        run: |
          ls -lh out/build/release/sqrail
          gzip -c -9 out/build/release/sqrail > out/build/release/sqrail.gz
          ls -lh out/build/release/sqrail.gz

  system-duckdb:
    name: System DuckDB build and test (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install DuckDB
        run: brew install duckdb
      - name: Configure
        run: >-
          cmake --preset system
          -DCMAKE_PREFIX_PATH="$(brew --prefix duckdb)"
      - name: Build
        run: cmake --build --preset system
      - name: Test
        run: ctest --preset system
      - name: Install
        run: |
          cmake --install out/build/system --prefix install --component sqrail
          install/bin/sqrail --version
          test -f install/share/doc/sqrail/THIRD_PARTY_NOTICES.md
          test ! -d install/share/doc/sqrail/licenses/duckdb-third-party
          test "$(find install -type f \( -name '*.a' -o -name '*.h' -o -name '*.hpp' \) | wc -l)" -eq 0
      - name: Verify DuckDB runtime
        run: |
          actual_version=$(install/bin/sqrail --version | sed -E 's/^.*\(DuckDB ([^)]+)\)$/\1/')
          expected_version=$(duckdb --version | awk '{print $1}')
          test "${actual_version}" = "${expected_version}"
          if [ "$(uname -s)" = Linux ]; then
            ldd install/bin/sqrail | grep 'libduckdb'
          else
            otool -L install/bin/sqrail | grep 'libduckdb'
          fi
      - name: Size
        run: ls -lh install/bin/sqrail

  debug-build:
    name: Developer debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev

  static-analysis:
    name: Clang static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format
        run: clang-format-18 --dry-run --Werror src/*.cpp src/*.hpp tests/*.cpp fuzz/*.cpp
      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset strict
      - name: Clang-Tidy build
        run: cmake --build --preset strict
      - name: Test
        run: ctest --preset strict

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset sanitize
      - name: Build
        run: cmake --build --preset sanitize
      - name: ASan and UBSan tests
        run: ctest --preset sanitize

  fuzz:
    name: Coverage-guided fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset fuzz
      - name: Build
        run: cmake --build --preset fuzz
      - name: Fuzz strict JSON boundary
        run: >-
          out/build/fuzz/sqrail-strict-json-fuzz
          -dict=fuzz/strict_json.dict
          -max_total_time=30
          -timeout=5
