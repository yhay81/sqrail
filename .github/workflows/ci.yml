name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: Documentation site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir "${{ github.workspace }}/site"
            --no-progress
            --include-fragments=anchor-only
            --accept "100..=103,200..=299,429"
            --remap "^https://sqrails[.]yhay81[.]com file://${{ github.workspace }}/site"
            --remap "https://github[.]com/${{ github.repository }}/blob/main https://github.com/${{ github.repository }}/blob/${{ github.sha }}"
            --remap "https://github[.]com/${{ github.repository }}/tree/main https://github.com/${{ github.repository }}/tree/${{ github.sha }}"
            --remap "https://github[.]com/${{ github.repository }}/releases/tag/v0[.]3[.]2 https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
            --remap "https://github[.]com/${{ github.repository }}/compare/v0[.]3[.]1[.][.][.]v0[.]3[.]2 https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
            --remap "https://github[.]com/${{ github.repository }}/compare/v0[.]3[.]2[.][.][.]HEAD https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
            --exclude "^https?://github[.]com/yhay81/sqrail/compare/"
            --exclude-path node_modules
            --exclude-path out
            --extensions "md,html,txt,xml,yml,yaml"
            "./**/*.md"
            "./site/**/*.html"
            "./site/*.txt"
            "./site/*.xml"
            "./.github/ISSUE_TEMPLATE/**/*.yml"
          fail: true
          failIfEmpty: true
          token: ${{ github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install pinned site tooling
        run: npm ci
      - name: Validate site
        run: npm run site:check

  workflow-analysis:
    name: GitHub Actions static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Actionlint
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          GOBIN="$RUNNER_TEMP/actionlint" \
            go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
      - name: Validate workflow syntax
        run: |
          "$RUNNER_TEMP/actionlint/actionlint"
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          version: 1.28.0
          persona: pedantic
          advanced-security: false
          annotations: true

  build:
    name: Build and test (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint shell
        if: runner.os == 'Linux'
        run: shellcheck tests/*.sh benchmarks/*.sh
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release
      - name: Verify published agent help
        run: diff -u <(out/build/release/sqrail --agent-help) site/agent-help.txt
      - name: Install
        run: |
          cmake --install out/build/release --prefix install --component sqrail
          install/bin/sqrail --version
          test -f install/share/doc/sqrail/THIRD_PARTY_NOTICES.md
          test -f install/share/doc/sqrail/benchmarks/AGENT_EVALUATION.md
          test -f install/share/doc/sqrail/benchmarks/agent-tasks.json
          test -f install/share/doc/sqrail/benchmarks/agent-tasks-v0.3.json
          test -x install/share/doc/sqrail/benchmarks/agent-eval/run.py
          test -f install/share/doc/sqrail/benchmarks/agent-eval/launcher.c
          test -f install/share/doc/sqrail/benchmarks/agent-eval/EXPERIMENTS.md
          test -x install/share/doc/sqrail/benchmarks/agent-eval.py
          test -x install/share/doc/sqrail/benchmarks/agent-run.py
          test -f install/share/doc/sqrail/benchmarks/agent_oracle.py
          test -f install/share/doc/sqrail/docs/PLATFORMS.md
          test -f install/share/doc/sqrail/docs/V0.3_RELEASE.md
          test -f install/share/sqrail/skills/sqrail/SKILL.md
          test -f install/share/sqrail/skills/sqrail/agents/openai.yaml
          test -f install/share/sqrail/plugin.json
          test -f install/share/doc/sqrail/licenses/duckdb-third-party/zstd/LICENSE
          test "$(find install -type f \( -name '*.a' -o -name '*.h' -o -name '*.hpp' \) | wc -l)" -eq 0
      - name: Verify Linux runtime
        if: runner.os == 'Linux'
        run: |
          ldd out/build/release/sqrail
          if ldd out/build/release/sqrail | grep -E 'libstdc\+\+|libgcc_s'; then
            echo "C++ runtime is dynamically linked" >&2
            exit 1
          fi
      - name: Size
        run: |
          ls -lh out/build/release/sqrail
          gzip -c -9 out/build/release/sqrail > out/build/release/sqrail.gz
          ls -lh out/build/release/sqrail.gz

  windows:
    name: Build and test Windows ${{ matrix.arch }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            preset: windows-x64
            machine: "8664"
          - runner: windows-11-arm
            arch: arm64
            preset: windows-arm64
            machine: "AA64"
    runs-on: ${{ matrix.runner }}
    env:
      SQRAIL_WINDOWS_PRESET: ${{ matrix.preset }}
      SQRAIL_WINDOWS_MACHINE: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset "$env:SQRAIL_WINDOWS_PRESET"
      - name: Build
        run: cmake --build --preset "$env:SQRAIL_WINDOWS_PRESET"
      - name: Test
        run: ctest --preset "$env:SQRAIL_WINDOWS_PRESET"
      - name: Install and verify
        shell: pwsh
        run: |
          cmake --install "out/build/$env:SQRAIL_WINDOWS_PRESET" --config Release --prefix install --component sqrail
          & "install/bin/sqrail.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "installed sqrail failed" }
          & tools/verify-windows-binary.ps1 `
            -Binary "install/bin/sqrail.exe" `
            -Machine "$env:SQRAIL_WINDOWS_MACHINE"
          $required = @(
            "install/share/doc/sqrail/THIRD_PARTY_NOTICES.md",
            "install/share/doc/sqrail/benchmarks/AGENT_EVALUATION.md",
            "install/share/doc/sqrail/benchmarks/agent-tasks.json",
            "install/share/doc/sqrail/benchmarks/agent-tasks-v0.3.json",
            "install/share/doc/sqrail/benchmarks/agent-eval/run.py",
            "install/share/doc/sqrail/benchmarks/agent-eval/launcher.c",
            "install/share/doc/sqrail/benchmarks/agent-eval.py",
            "install/share/doc/sqrail/benchmarks/agent-run.py",
            "install/share/doc/sqrail/benchmarks/agent_oracle.py",
            "install/share/doc/sqrail/docs/PLATFORMS.md",
            "install/share/doc/sqrail/docs/V0.3_RELEASE.md",
            "install/share/sqrail/skills/sqrail/SKILL.md",
            "install/share/sqrail/skills/sqrail/agents/openai.yaml",
            "install/share/sqrail/plugin.json"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "missing installed file: $path" }
          }
          & "install/bin/sqrail.exe" run -o private.parquet "SELECT 1 AS value"
          if ($LASTEXITCODE -ne 0) { throw "Windows output test failed" }
          $acl = Get-Acl private.parquet
          if (-not $acl.AreAccessRulesProtected) { throw "output ACL still inherits permissions" }
          Get-Item "install/bin/sqrail.exe" | Select-Object Name, Length

  system-duckdb:
    name: System DuckDB build and test (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install DuckDB
        run: brew install duckdb
      - name: Configure
        run: >-
          cmake --preset system
          -DCMAKE_PREFIX_PATH="$(brew --prefix duckdb)"
      - name: Build
        run: cmake --build --preset system
      - name: Test
        run: ctest --preset system
      - name: Install
        run: |
          cmake --install out/build/system --prefix install --component sqrail
          install/bin/sqrail --version
          test -f install/share/doc/sqrail/THIRD_PARTY_NOTICES.md
          test -f install/share/doc/sqrail/benchmarks/AGENT_EVALUATION.md
          test -f install/share/doc/sqrail/benchmarks/agent-tasks.json
          test -f install/share/doc/sqrail/benchmarks/agent-tasks-v0.3.json
          test -x install/share/doc/sqrail/benchmarks/agent-eval/run.py
          test -f install/share/doc/sqrail/benchmarks/agent-eval/launcher.c
          test -x install/share/doc/sqrail/benchmarks/agent-eval.py
          test -x install/share/doc/sqrail/benchmarks/agent-run.py
          test -f install/share/doc/sqrail/benchmarks/agent_oracle.py
          test -f install/share/doc/sqrail/docs/PLATFORMS.md
          test -f install/share/doc/sqrail/docs/V0.3_RELEASE.md
          test -f install/share/sqrail/skills/sqrail/SKILL.md
          test -f install/share/sqrail/skills/sqrail/agents/openai.yaml
          test -f install/share/sqrail/plugin.json
          test ! -d install/share/doc/sqrail/licenses/duckdb-third-party
          test "$(find install -type f \( -name '*.a' -o -name '*.h' -o -name '*.hpp' \) | wc -l)" -eq 0
      - name: Verify DuckDB runtime
        run: |
          actual_version=$(install/bin/sqrail --version | sed -E 's/^.*\(DuckDB ([^)]+)\)$/\1/')
          expected_version=$(duckdb --version | awk '{print $1}')
          test "${actual_version}" = "${expected_version}"
          if [ "$(uname -s)" = Linux ]; then
            readelf -d install/bin/sqrail | grep "$(brew --prefix duckdb)/lib"
            ldd install/bin/sqrail | grep 'libduckdb'
          else
            otool -L install/bin/sqrail | grep 'libduckdb'
          fi
      - name: Size
        run: ls -lh install/bin/sqrail

  core-tests:
    name: Native C++ tests without Python
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: >-
          cmake --preset core
          -DCMAKE_DISABLE_FIND_PACKAGE_Python3=TRUE
      - name: Build
        run: cmake --build --preset core
      - name: Test
        run: ctest --preset core

  static-analysis:
    name: Clang static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format
        run: >-
          clang-format-18 --dry-run --Werror
          src/*.cpp src/*.hpp tests/*.cpp fuzz/*.cpp
          benchmarks/agent-eval/launcher.c
      - name: Validate agent evaluation runner
        run: |
          python3 -m py_compile benchmarks/agent-eval/run.py
          clang-18 \
            -std=c11 -O2 -Wall -Wextra -Werror \
            -DRAIL_MODE=0 \
            '-DRAIL_TARGET="/bin/true"' \
            '-DRAIL_HELP="/dev/null"' \
            '-DRAIL_LOG="/tmp/sqrail-agent-eval.log"' \
            benchmarks/agent-eval/launcher.c \
            -o "$RUNNER_TEMP/rail-launcher"
      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset strict
      - name: Clang-Tidy build
        run: cmake --build --preset strict
      - name: Test
        run: ctest --preset strict

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset sanitize
      - name: Build
        run: cmake --build --preset sanitize
      - name: ASan and UBSan tests
        run: ctest --preset sanitize

  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset thread
      - name: Build
        run: cmake --build --preset thread
      - name: ThreadSanitizer tests
        run: ctest --preset thread

  fuzz:
    name: Coverage-guided fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset fuzz
      - name: Build
        run: cmake --build --preset fuzz
      - name: Fuzz strict JSON boundary
        run: >-
          out/build/fuzz/sqrail-strict-json-fuzz
          -dict=fuzz/strict_json.dict
          -max_total_time=30
          -timeout=5
      - name: Fuzz CLI parser boundary
        run: >-
          out/build/fuzz/sqrail-cli-fuzz
          -dict=fuzz/cli.dict
          -max_total_time=30
          -timeout=5
