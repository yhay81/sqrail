name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x86_64
            strip: strip --strip-unneeded
          - runner: ubuntu-22.04-arm
            target: linux-arm64
            strip: strip --strip-unneeded
          - runner: macos-15
            target: macos-arm64
            strip: strip -x
          - runner: macos-15-intel
            target: macos-x86_64
            strip: strip -x
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DSQRAIL_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --target sqrail --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify tag
        run: |
          actual_version=$(build/sqrail --version | awk '{print $2}')
          test "v${actual_version}" = "${GITHUB_REF_NAME}"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          STRIP_COMMAND: ${{ matrix.strip }}
        run: |
          package_name="sqrail-${GITHUB_REF_NAME}-${TARGET}"
          cmake --install build --prefix "dist/${package_name}" --component sqrail
          ${STRIP_COMMAND} "dist/${package_name}/bin/sqrail"
          "dist/${package_name}/bin/sqrail" --version
          test -f "dist/${package_name}/share/doc/sqrail/THIRD_PARTY_NOTICES.md"
          test -f "dist/${package_name}/share/doc/sqrail/licenses/duckdb-third-party/zstd/LICENSE"
          test "$(find "dist/${package_name}" -type f \( -name '*.a' -o -name '*.h' -o -name '*.hpp' \) | wc -l)" -eq 0
          if [ "$(uname -s)" = Linux ]; then
            ldd "dist/${package_name}/bin/sqrail"
            if ldd "dist/${package_name}/bin/sqrail" | grep -E 'libstdc\+\+|libgcc_s'; then
              echo "C++ runtime is dynamically linked" >&2
              exit 1
            fi
          else
            otool -L "dist/${package_name}/bin/sqrail"
          fi
          tar -C dist -czf "${package_name}.tar.gz" "${package_name}"
          ls -lh "${package_name}.tar.gz"
      - name: Attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: sqrail-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sqrail-${{ matrix.target }}
          path: sqrail-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: sqrail-*
          merge-multiple: true
      - name: Checksums
        working-directory: release-assets
        run: sha256sum ./*.tar.gz > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --title "sqrail ${GITHUB_REF_NAME}"
          --generate-notes
