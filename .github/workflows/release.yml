name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify signed annotated tag
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source-date-epoch: ${{ steps.metadata.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify GitHub tag signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_type=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.type')
          test "$tag_type" = tag
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.sha')
          verified=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification.verified')
          test "$verified" = true
      - name: Record deterministic build timestamp
        id: metadata
        run: echo "source-date-epoch=$(git show -s --format=%ct "${GITHUB_SHA}")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: verify-tag
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # Request the OIDC token used by artifact attestations.
      attestations: write # Publish build provenance for the release archive.
      artifact-metadata: write # Register the attested release archive with GitHub.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x86_64
            strip: strip --strip-unneeded
            architecture: x86-64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
            strip: strip --strip-unneeded
            architecture: aarch64
          - runner: macos-15
            target: macos-arm64
            strip: strip -x
            architecture: arm64
          - runner: macos-15-intel
            target: macos-x86_64
            strip: strip -x
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE_NAME: sqrail-${{ github.ref_name }}-${{ matrix.target }}
      SOURCE_DATE_EPOCH: ${{ needs.verify-tag.outputs.source-date-epoch }}
      SQRAIL_EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release
      - name: Verify tag
        run: |
          actual_version=$(out/build/release/sqrail --version | awk '{print $2}')
          test "v${actual_version}" = "${GITHUB_REF_NAME}"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          STRIP_COMMAND: ${{ matrix.strip }}
        run: |
          cmake --install out/build/release --prefix "dist/${PACKAGE_NAME}" --component sqrail
          ${STRIP_COMMAND} "dist/${PACKAGE_NAME}/bin/sqrail"
          "dist/${PACKAGE_NAME}/bin/sqrail" --version
          file "dist/${PACKAGE_NAME}/bin/sqrail" | grep -F "$SQRAIL_EXPECTED_ARCHITECTURE"
          test -f "dist/${PACKAGE_NAME}/share/doc/sqrail/THIRD_PARTY_NOTICES.md"
          test -f "dist/${PACKAGE_NAME}/share/doc/sqrail/benchmarks/AGENT_EVALUATION.md"
          test -f "dist/${PACKAGE_NAME}/share/doc/sqrail/benchmarks/agent-tasks.json"
          test -f "dist/${PACKAGE_NAME}/share/doc/sqrail/benchmarks/agent-tasks-v0.3.json"
          test -x "dist/${PACKAGE_NAME}/share/doc/sqrail/benchmarks/agent-eval/run.py"
          test -f "dist/${PACKAGE_NAME}/share/doc/sqrail/benchmarks/agent-eval/launcher.c"
          test -f "dist/${PACKAGE_NAME}/share/doc/sqrail/benchmarks/agent-eval/EXPERIMENTS.md"
          test -x "dist/${PACKAGE_NAME}/share/doc/sqrail/benchmarks/agent-eval.py"
          test -x "dist/${PACKAGE_NAME}/share/doc/sqrail/benchmarks/agent-run.py"
          test -f "dist/${PACKAGE_NAME}/share/doc/sqrail/benchmarks/agent_oracle.py"
          test -f "dist/${PACKAGE_NAME}/share/doc/sqrail/docs/PLATFORMS.md"
          test -f "dist/${PACKAGE_NAME}/share/doc/sqrail/docs/V0.3_RELEASE.md"
          test -f "dist/${PACKAGE_NAME}/share/doc/sqrail/licenses/duckdb-third-party/zstd/LICENSE"
          test "$(find "dist/${PACKAGE_NAME}" -type f \( -name '*.a' -o -name '*.h' -o -name '*.hpp' \) | wc -l)" -eq 0
          if [ "$(uname -s)" = Linux ]; then
            ldd "dist/${PACKAGE_NAME}/bin/sqrail"
            if ldd "dist/${PACKAGE_NAME}/bin/sqrail" | grep -E 'libstdc\+\+|libgcc_s'; then
              echo "C++ runtime is dynamically linked" >&2
              exit 1
            fi
          else
            otool -L "dist/${PACKAGE_NAME}/bin/sqrail"
          fi
          python3 tools/generate-sbom.py \
            --root "dist/${PACKAGE_NAME}" \
            --output "dist/${PACKAGE_NAME}/share/doc/sqrail/SBOM.spdx.json" \
            --version "${GITHUB_REF_NAME#v}" \
            --target "$TARGET" \
            --duckdb-version v1.5.5 \
            --duckdb-revision d8cdaa33fda8df955cc76ef58a280f68f4cd43fa
          cp "dist/${PACKAGE_NAME}/share/doc/sqrail/SBOM.spdx.json" "${PACKAGE_NAME}.spdx.json"
          python3 tools/package-release.py --root "dist/${PACKAGE_NAME}" --output "${PACKAGE_NAME}.tar.gz"
          python3 tools/package-release.py --root "dist/${PACKAGE_NAME}" --output "${PACKAGE_NAME}-repro.tar.gz"
          cmp "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}-repro.tar.gz"
          rm "${PACKAGE_NAME}-repro.tar.gz"
          ls -lh "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}.spdx.json"
      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: sqrail-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
      - name: Attest SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: sqrail-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          sbom-path: sqrail-${{ github.ref_name }}-${{ matrix.target }}.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sqrail-${{ matrix.target }}
          path: |
            sqrail-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            sqrail-${{ github.ref_name }}-${{ matrix.target }}.spdx.json
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build ${{ matrix.target }}
    needs: verify-tag
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write # Request the OIDC token used by artifact attestations.
      attestations: write # Publish provenance and SBOM attestations.
      artifact-metadata: write # Register the attested release archive with GitHub.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-x86_64
            preset: windows-x64
            machine: "8664"
          - runner: windows-11-arm
            target: windows-arm64
            preset: windows-arm64
            machine: "AA64"
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE_NAME: sqrail-${{ github.ref_name }}-${{ matrix.target }}
      SOURCE_DATE_EPOCH: ${{ needs.verify-tag.outputs.source-date-epoch }}
      SQRAIL_WINDOWS_PRESET: ${{ matrix.preset }}
      SQRAIL_WINDOWS_MACHINE: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset "$env:SQRAIL_WINDOWS_PRESET"
      - name: Build
        run: cmake --build --preset "$env:SQRAIL_WINDOWS_PRESET"
      - name: Test
        run: ctest --preset "$env:SQRAIL_WINDOWS_PRESET"
      - name: Verify tag version and package
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $binary = "out/build/$env:SQRAIL_WINDOWS_PRESET/Release/sqrail.exe"
          $version = (& $binary --version).Split(" ")[1]
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag and binary versions differ" }
          cmake --install "out/build/$env:SQRAIL_WINDOWS_PRESET" --config Release --prefix "dist/$env:PACKAGE_NAME" --component sqrail
          & "dist/$env:PACKAGE_NAME/bin/sqrail.exe" --version
          & tools/verify-windows-binary.ps1 `
            -Binary "dist/$env:PACKAGE_NAME/bin/sqrail.exe" `
            -Machine "$env:SQRAIL_WINDOWS_MACHINE"
          $required = @(
            "dist/$env:PACKAGE_NAME/share/doc/sqrail/THIRD_PARTY_NOTICES.md",
            "dist/$env:PACKAGE_NAME/share/doc/sqrail/benchmarks/AGENT_EVALUATION.md",
            "dist/$env:PACKAGE_NAME/share/doc/sqrail/benchmarks/agent-tasks.json",
            "dist/$env:PACKAGE_NAME/share/doc/sqrail/benchmarks/agent-tasks-v0.3.json",
            "dist/$env:PACKAGE_NAME/share/doc/sqrail/benchmarks/agent-eval/run.py",
            "dist/$env:PACKAGE_NAME/share/doc/sqrail/benchmarks/agent-eval/launcher.c",
            "dist/$env:PACKAGE_NAME/share/doc/sqrail/benchmarks/agent-eval/EXPERIMENTS.md",
            "dist/$env:PACKAGE_NAME/share/doc/sqrail/benchmarks/agent-eval.py",
            "dist/$env:PACKAGE_NAME/share/doc/sqrail/benchmarks/agent-run.py",
            "dist/$env:PACKAGE_NAME/share/doc/sqrail/benchmarks/agent_oracle.py",
            "dist/$env:PACKAGE_NAME/share/doc/sqrail/docs/PLATFORMS.md",
            "dist/$env:PACKAGE_NAME/share/doc/sqrail/docs/V0.3_RELEASE.md"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "missing package file: $path" }
          }
          python tools/generate-sbom.py `
            --root "dist/$env:PACKAGE_NAME" `
            --output "dist/$env:PACKAGE_NAME/share/doc/sqrail/SBOM.spdx.json" `
            --version $version `
            --target $env:TARGET `
            --duckdb-version v1.5.5 `
            --duckdb-revision d8cdaa33fda8df955cc76ef58a280f68f4cd43fa
          Copy-Item "dist/$env:PACKAGE_NAME/share/doc/sqrail/SBOM.spdx.json" "$env:PACKAGE_NAME.spdx.json"
          python tools/package-release.py --root "dist/$env:PACKAGE_NAME" --output "$env:PACKAGE_NAME.zip"
          python tools/package-release.py --root "dist/$env:PACKAGE_NAME" --output "$env:PACKAGE_NAME-repro.zip"
          $first = (Get-FileHash "$env:PACKAGE_NAME.zip" -Algorithm SHA256).Hash
          $second = (Get-FileHash "$env:PACKAGE_NAME-repro.zip" -Algorithm SHA256).Hash
          if ($first -ne $second) { throw "Windows release archive is not reproducible" }
          Remove-Item "$env:PACKAGE_NAME-repro.zip"
      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: sqrail-${{ github.ref_name }}-${{ matrix.target }}.zip
      - name: Attest SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: sqrail-${{ github.ref_name }}-${{ matrix.target }}.zip
          sbom-path: sqrail-${{ github.ref_name }}-${{ matrix.target }}.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sqrail-${{ matrix.target }}
          path: |
            sqrail-${{ github.ref_name }}-${{ matrix.target }}.zip
            sqrail-${{ github.ref_name }}-${{ matrix.target }}.spdx.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [verify-tag, build, build-windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write # Create the GitHub release and upload archives.
      id-token: write # Request the OIDC token used by artifact attestations.
      attestations: write # Publish provenance for the checksum manifest.
      artifact-metadata: write # Register the attested checksum manifest with GitHub.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: sqrail-*
          merge-multiple: true
      - name: Checksums
        working-directory: release-assets
        run: |
          manifest=$(mktemp)
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
            sort -z |
            xargs -0 sha256sum > "$manifest"
          mv "$manifest" SHA256SUMS
      - name: Attest checksum manifest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: release-assets/SHA256SUMS
      - name: Create complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --title "sqrail ${GITHUB_REF_NAME}"
          --generate-notes
          --draft
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
      - name: Verify immutable release attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          max_attempts=7
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            if gh release verify "${GITHUB_REF_NAME}"; then
              exit 0
            fi

            if ((attempt == max_attempts)); then
              echo "::error::Release attestation was not verifiable after ${max_attempts} attempts"
              exit 1
            fi

            delay=$((1 << attempt))
            if ((delay > 30)); then
              delay=30
            fi
            echo "::notice::Release attestation is not available yet; retrying in ${delay}s"
            sleep "$delay"
          done
